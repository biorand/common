name: CI
on: [push, pull_request]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # nuget.org trusted publishing
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Restore
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release
    - name: Pack
      run: dotnet pack -c Release --no-build -o out
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: biorand-common
        path: out/**/*
    - name: Create release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        fail_on_unmatched_files: true
        files: |
          out/*.nupkg
    - name: Log in to nuget.org
      id: nuget-login
      if: startsWith(github.ref, 'refs/tags/v')
      uses: NuGet/login@v1
      with:
        user: IntelOrca
    - name: Publish to nuget.org
      if: startsWith(github.ref, 'refs/tags/v')
      run: dotnet nuget push out/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
